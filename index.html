<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이윤주의 라인댄스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#111;overflow:hidden;font-family:'Noto Serif KR',serif}
  #stage{position:absolute;inset:0;margin:auto;aspect-ratio:16/9;max-width:100vw;max-height:100vh;width:100vw;}
  svg{width:100%;height:100%;display:block}
  #play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;
    background:rgba(239,230,212,.55);backdrop-filter:blur(2px);cursor:pointer;color:#1b1b1b;font-size:22px;border:0;width:100%;font-family:inherit}
  #play span{width:96px;height:96px;border-radius:50%;background:#b3322a;color:#f3ead8;display:flex;align-items:center;justify-content:center;font-size:40px;box-shadow:4px 6px 0 rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="stage">
<svg id="svg" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="3"/>
      <feColorMatrix values="0 0 0 0 .35  0 0 0 0 .3  0 0 0 0 .22  0 0 0 .55 -.18"/>
    </filter>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".006 .04" numOctaves="2" seed="9"/>
      <feColorMatrix values="0 0 0 0 .5  0 0 0 0 .42  0 0 0 0 .3  0 0 0 .5 -.2"/>
    </filter>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".012" numOctaves="4" seed="2" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="45" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="7"/>
    </filter>
    <filter id="brush" x="-10%" y="-40%" width="120%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .25" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="28" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.2"/>
    </filter>
    <filter id="brushBig" filterUnits="userSpaceOnUse" x="0" y="0" width="1920" height="1080">
      <feTurbulence type="fractalNoise" baseFrequency=".02 .25" numOctaves="3" seed="5" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="34" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feGaussianBlur in="d" stdDeviation="1.4"/>
    </filter>
    <filter id="cut"x="-10%" y="-10%" width="130%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G" result="d"/>
      <feDropShadow in="d" dx="5" dy="8" stdDeviation="5" flood-color="#2a1c10" flood-opacity=".38"/>
    </filter>
    <filter id="line" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="1" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <linearGradient id="mtnA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1c1c" stop-opacity=".85"/><stop offset=".75" stop-color="#3a3a3a" stop-opacity=".15"/><stop offset="1" stop-color="#3a3a3a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mtnB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4a48" stop-opacity=".55"/><stop offset="1" stop-color="#4a4a48" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75">
      <stop offset=".6" stop-color="#5a4630" stop-opacity="0"/><stop offset="1" stop-color="#5a4630" stop-opacity=".35"/>
    </radialGradient>
    <linearGradient id="gold" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="520" y2="0" spreadMethod="repeat" gradientTransform="rotate(18)">
      <stop offset="0" stop-color="#b9831c"/><stop offset=".28" stop-color="#ffe08a"/><stop offset=".42" stop-color="#fffbe6"/>
      <stop offset=".56" stop-color="#ffd36b"/><stop offset="1" stop-color="#b9831c"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="goldglow" filterUnits="userSpaceOnUse" x="0" y="200" width="1920" height="500">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="b"/>
      <feFlood flood-color="#ffd36b" flood-opacity=".55"/><feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <path id="star" d="M0 -1 Q0.13 -0.13 1 0 Q0.13 0.13 0 1 Q-0.13 0.13 -1 0 Q-0.13 -0.13 0 -1 Z"/>
  </defs>

  <rect width="1920" height="1080" fill="#efe6d4"/>
  <rect width="1920" height="1080" filter="url(#fiber)"/>

  <!-- ink bloom + mountains -->
  <circle id="bloom" cx="960" cy="470" r="0" fill="#1b1b1b" filter="url(#ink)"/>
  <g id="mtnFar" opacity="0" filter="url(#ink)">
    <path d="M-50 720 C 150 520 260 430 380 470 C 470 500 520 380 640 330 C 760 290 820 470 940 520 L 1000 720 Z" fill="url(#mtnB)"/>
    <path d="M900 720 C 1050 520 1150 400 1300 360 C 1420 330 1480 470 1600 440 C 1720 410 1820 330 1980 380 L 1980 720 Z" fill="url(#mtnB)"/>
  </g>
  <g id="mtnNear" opacity="0" filter="url(#ink)">
    <path d="M-50 760 C 120 640 220 520 300 560 C 380 600 420 520 500 600 C 600 690 700 650 760 760 Z" fill="url(#mtnA)"/>
    <path d="M1250 760 C 1380 600 1450 500 1560 520 C 1650 540 1700 610 1800 560 C 1880 520 1940 560 1980 600 L 1980 760 Z" fill="url(#mtnA)"/>
  </g>

  <!-- paper cutouts -->
  <circle id="sun" cx="1500" cy="250" r="95" fill="#b3322a" filter="url(#cut)" opacity="0"/>
  <g id="cloud" filter="url(#cut)" opacity="0">
    <path d="M220 230 c 20 -40 80 -40 100 -10 c 20 -40 90 -40 105 10 c 40 0 55 40 25 55 l -250 0 c -40 -10 -30 -55 20 -55 z" fill="#f7f1e4"/>
    <path d="M250 262 c 40 -12 90 -12 140 0 M300 280 c 30 -8 60 -8 90 0" stroke="#c9b79a" stroke-width="3" fill="none"/>
  </g>
  <g id="hill3" filter="url(#cut)"><path d="M-40 1100 L -40 800 C 200 720 420 770 640 810 C 900 860 1100 760 1400 740 C 1650 725 1800 780 1960 760 L 1960 1100 Z" fill="#c8b38f"/></g>
  <g id="hill2" filter="url(#cut)"><path d="M-40 1100 L -40 860 C 300 820 520 880 800 870 C 1100 860 1300 820 1600 840 C 1780 850 1880 870 1960 860 L 1960 1100 Z" fill="#8f6f4e"/></g>
  <g id="hill1" filter="url(#cut)"><path d="M-40 1100 L -40 905 C 400 890 800 920 1200 905 C 1500 895 1750 915 1960 900 L 1960 1100 Z" fill="#2f3533"/></g>

  <!-- dance path (ink line from the dancers' feet into the title) -->
  <path id="dline" d="M -60 960 C 120 930 220 990 380 955 S 620 915 780 958 S 1080 1000 1280 950 S 1640 900 1760 800 C 1880 690 1800 520 1600 470 C 1520 450 1470 430 1440 420"
        fill="none" stroke="#1b1b1b" stroke-width="6" stroke-linecap="round" filter="url(#brush)"/>
  <g id="prints"></g>

  <!-- dancers -->
  <g id="dancers"></g>

  <!-- titles -->
  <g id="title1" font-family="'Noto Serif KR',serif" text-anchor="middle">
    <ellipse id="wash" cx="960" cy="400" rx="520" ry="120" fill="#1b1b1b" opacity="0" filter="url(#ink)"/>
    <g id="k_title"></g>
    <text id="t_en" x="960" y="560" font-size="40" font-weight="600" fill="#b3322a" letter-spacing="34" opacity="0">L I N E · D A N C E</text>
    <g id="k_tag"></g>
  </g>

  <!-- end card -->
  <g id="endcard" text-anchor="middle">
    <path id="sweep" d="M 200 480 C 600 440 1000 520 1360 470 C 1500 450 1640 465 1740 480" fill="none" stroke="#151515" stroke-width="330" stroke-linecap="round" filter="url(#brushBig)" opacity=".92"/>
    <g id="k_en"></g>
    <g id="k_name" filter="url(#goldglow)"></g>
    <g id="k_sub"></g>
    <g id="sparks" filter="url(#glow)"></g>
    <g id="seal" opacity="0" filter="url(#cut)">
      <rect x="-58" y="-80" width="116" height="160" rx="10" fill="#b3322a"/>
      <rect x="-48" y="-70" width="96" height="140" rx="6" fill="none" stroke="#f3ead8" stroke-width="3"/>
      <text x="0" y="-8" font-family="'Noto Serif KR',serif" font-weight="900" font-size="58" fill="#f3ead8" text-anchor="middle">윤</text>
      <text x="0" y="56" font-family="'Noto Serif KR',serif" font-weight="900" font-size="58" fill="#f3ead8" text-anchor="middle">주</text>
    </g>
  </g>

  <!-- captions -->
  <g id="capg" opacity="0">
    <rect id="capbg" x="560" y="985" width="800" height="62" rx="4" fill="#efe6d4" opacity=".88" filter="url(#cut)"/>
    <text id="cap" x="960" y="1028" text-anchor="middle" font-family="'Noto Serif KR',serif" font-weight="600" font-size="32" fill="#1b1b1b"></text>
  </g>

  <rect width="1920" height="1080" filter="url(#paper)" pointer-events="none"/>
  <rect width="1920" height="1080" fill="url(#vig)" pointer-events="none"/>
</svg>
<button id="play"><span>▶</span>소리를 켜고 재생하세요 · 30초</button>
</div>

<script src="voice.js"></script>
<script>
const NS='http://www.w3.org/2000/svg';
const $=id=>document.getElementById(id);
const el=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const seg=(t,a,b,f=ease)=>f(cl((t-a)/(b-a)));
const DUR=30, BPM=128;

const CAPS=["한 걸음, 또 한 걸음.","음악에 몸을 맡기면, 선이 춤이 됩니다.","나이도 실력도 상관없어요. 함께 맞추는 발걸음.","이윤주의 라인댄스. 지금, 함께 시작하세요."];
const VT=[0.8,7.2,14.4,23.6];
let VDUR=[2,3.2,4.2,3.8];

/* ---------- dash setup ---------- */
function prepDash(e){const L=(e.getTotalLength?e.getTotalLength():0)||2600;e.style.strokeDasharray=L+' '+L;e._L=L;return e}
function draw(e,p){e.style.strokeDashoffset=e._L*(1-p)}
const textDash=(e,L)=>{e._L=L;e.style.strokeDasharray=L+' '+L;return e};

const dline=prepDash($('dline')), sweep=prepDash($('sweep'));

/* ---------- kinetic typography ---------- */
const KC={}, FS="'Noto Serif KR',serif", FE="'Cormorant Garamond',serif";
const backOut=x=>{const c1=1.9,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
function measure(ch,r){
  const t=el('text',{x:0,y:0,'font-size':r.size,'font-weight':r.weight||900,'font-family':r.family||FS,'font-style':r.style||'normal',visibility:'hidden'},$('svg'));
  t.textContent=ch; const w=t.getComputedTextLength(); t.remove(); return w+(r.ls||0);
}
function buildK(id,runs,cx,y){
  const g=$(id); g.innerHTML=''; const items=[];
  runs.forEach(r=>{for(const ch of r.t) items.push({ch,r,w:ch===' '?r.size*0.3:measure(ch,r)})});
  const total=items.reduce((a,i)=>a+i.w,0); let x=cx-total/2; const chars=[];
  items.forEach(it=>{
    if(it.ch!==' '){
      const e=el('text',{'font-size':it.r.size,'font-weight':it.r.weight||900,'font-family':it.r.family||FS,'font-style':it.r.style||'normal','text-anchor':'middle',fill:it.r.fill||'#1b1b1b',opacity:0},g);
      if(it.r.stroke){e.setAttribute('stroke',it.r.stroke);e.setAttribute('stroke-width',it.r.sw||2);e.setAttribute('paint-order','stroke')}
      e.textContent=it.ch; chars.push({e,cx:x+it.w/2,y,r:it.r});
    }
    x+=it.w;
  });
  KC[id]={chars,x0:cx-total/2,x1:cx+total/2,y}; return KC[id];
}
let KB=false;
async function buildKinetic(){
  await Promise.all([document.fonts.load('900 100px "Noto Serif KR"','라인댄스이윤주의'),document.fonts.load('600 48px "Noto Serif KR"','나이도실력상관없이함께맞추는발걸음지금시작하세요'),
    document.fonts.load('italic 600 64px "Cormorant Garamond"','YounJu Lee')].map(p=>p.catch(()=>{})));
  buildK('k_title',[{t:'라인댄스',size:210,fill:'#c2362c',stroke:'#1b1b1b',sw:4,ls:16}],960,470);
  buildK('k_tag',[{t:'나이도 실력도 상관없이, 함께 맞추는 발걸음',size:48,weight:600,fill:'#1b1b1b'}],960,650);
  buildK('k_en',[{t:'YounJu Lee',size:70,weight:600,family:FE,style:'italic',fill:'#ffe9a8',ls:4}],960,350);
  const nm=buildK('k_name',[{t:'이윤주',size:200,fill:'url(#gold)',stroke:'#fff3c4',sw:1.5,ls:10},{t:'의 라인댄스',size:96,fill:'#f3ead8',ls:4}],960,545);
  buildK('k_sub',[{t:'지금, 함께 시작하세요',size:50,weight:600,fill:'#1b1b1b',ls:6}],960,725);
  // sparkles around the name
  const sg=$('sparks'); sg.innerHTML=''; SP.length=0;
  const W=nm.x1-nm.x0, seed=[[.04,.05,26],[.13,.92,18],[.22,.1,15],[.31,.98,22],[.42,.03,17],[.5,.9,28],[.6,.08,20],[.7,.95,16],[.82,.04,24],[.95,.2,30],[.9,.85,18],[.02,.7,16]];
  seed.forEach(([fx,fy,s],i)=>{const u=el('use',{href:'#star',fill:'#fff6c8'},sg);SP.push({u,x:nm.x0+fx*W,y:nm.y-190+fy*215,s,ph:i*0.173})});
  KB=true;
}
const SP=[];
function animK(id,t,t0,stag,dur,mode,out=1){
  const k=KC[id]; if(!k)return;
  k.chars.forEach((c,i)=>{
    const p=cl((t-t0-i*stag)/dur), pe=mode==='pop'?backOut(p):eo(p);
    const sc=mode==='pop'?0.15+0.85*pe:1, dy=(1-pe)*(mode==='rise'?70:45), rot=(1-pe)*(i%2?-16:16);
    c.e.setAttribute('transform',`translate(${c.cx},${c.y+dy}) rotate(${rot}) scale(${sc})`);
    c.e.setAttribute('opacity',cl(p*3)*out);
  });
}
function animDraw(id,t,t0,stag,dur,out=1){
  const k=KC[id]; if(!k)return;
  k.chars.forEach((c,i)=>{
    const p=cl((t-t0-i*stag)/dur), f=cl((p-.55)/.45), b=backOut(f);
    c.e.style.strokeDasharray='1100 1100'; c.e.style.strokeDashoffset=1100*(1-eo(cl(p/.7)));
    c.e.setAttribute('fill-opacity',f);
    c.e.setAttribute('transform',`translate(${c.cx},${c.y}) translate(0,-60) scale(${1+0.06*Math.sin(Math.PI*f)}) translate(0,60)`);
    c.e.setAttribute('opacity',cl(p*8)*out);
  });
}

/* footprints along the dance line */
const prints=[];
for(let d=60,i=0; d<dline._L*0.62; d+=62,i++){
  const p=dline.getPointAtLength(d), q=dline.getPointAtLength(d+2);
  const ang=Math.atan2(q.y-p.y,q.x-p.x)*180/Math.PI, off=i%2?14:-14;
  const g=el('g',{transform:`translate(${p.x},${p.y+off}) rotate(${ang})`,opacity:0},$('prints'));
  el('ellipse',{rx:13,ry:6,fill:'#1b1b1b',filter:'url(#brush)'},g);
  prints.push({g,d});
}

/* ---------- paper-cutout dancers ---------- */
const DCOL=[['#2b2b2b','#b3322a'],['#2b2b2b','#d9c7a3'],['#2b2b2b','#6f8a7e'],['#2b2b2b','#c9772f']];
const dancers=DCOL.map(([c,a],i)=>{
  const root=el('g',{filter:'url(#cut)'},$('dancers'));
  const body=el('g',{},root);
  const legL=el('line',{x1:-7,y1:-62,stroke:c,'stroke-width':10,'stroke-linecap':'round'},body);
  const legR=el('line',{x1:7,y1:-62,stroke:c,'stroke-width':10,'stroke-linecap':'round'},body);
  const bootL=el('ellipse',{rx:11,ry:6,fill:a},body), bootR=el('ellipse',{rx:11,ry:6,fill:a},body);
  const armL=el('line',{x1:-10,y1:-122,stroke:c,'stroke-width':8,'stroke-linecap':'round'},body);
  const armR=el('line',{x1:10,y1:-122,stroke:c,'stroke-width':8,'stroke-linecap':'round'},body);
  el('path',{d:'M-15 -130 L15 -130 L34 -58 Q0 -50 -34 -58 Z',fill:a},body);
  el('path',{d:'M-15 -130 L15 -130 L12 -100 L-12 -100 Z',fill:c,opacity:.85},body);
  el('circle',{cx:0,cy:-150,r:17,fill:c},body);
  el('path',{d:'M-30 -160 Q0 -150 30 -160 Q22 -152 0 -151 Q-22 -152 -30 -160 Z M-14 -160 Q-12 -182 0 -180 Q12 -182 14 -160 Z',fill:a,stroke:c,'stroke-width':2},body);
  return {root,body,legL,legR,bootL,bootR,armL,armR,i};
});
function limb(line,x,y,len,deg){const r=deg*Math.PI/180;const x2=x+Math.sin(r)*len,y2=y+Math.cos(r)*len;line.setAttribute('x2',x2);line.setAttribute('y2',y2);return [x2,y2]}

function poseDancers(t){
  const beat=t*BPM/60;
  dancers.forEach(d=>{
    const delay=d.i*0.35;
    const enter=seg(t,3+delay,7+delay,eo);
    const homeX=600+d.i*240;
    let gx=-200+(homeX+200)*enter;
    let floorY=905-(d.i%2)*6, bob=0, a=0, kick=0, arm=0;
    if(t>3){
      const b=beat-delay*2, p=((b%8)+8)%8;
      const tri = p<4 ? p : 8-p;           // grapevine side-to-side
      gx += (tri-2)*34*seg(t,7,8);
      a = Math.sin(b*Math.PI)*24;
      bob = -Math.abs(Math.sin(b*Math.PI))*9;
      if((p>3.3&&p<4)||(p>7.3)) kick = Math.sin(((p%4)-3.3)/0.7*Math.PI)*70;
      arm = Math.sin(b*Math.PI/2)*30;
    }
    // end-card: dancers step aside to frame the title
    const endS=seg(t,20.5,22.5);
    const sideX = d.i<2 ? 230+d.i*170 : 1520+(d.i-2)*170;
    gx = gx+(sideX-gx)*endS;
    d.root.setAttribute('transform',`translate(${gx},${floorY+bob}) scale(${1-0.08*endS})`);
    const [lx,ly]=limb(d.legL,-7,-62,62,a); d.bootL.setAttribute('cx',lx+5); d.bootL.setAttribute('cy',ly);
    const [rx,ry]=limb(d.legR,7,-62,62,-a+kick); d.bootR.setAttribute('cx',rx+5); d.bootR.setAttribute('cy',ry);
    limb(d.armL,-10,-122,52,40+arm); limb(d.armR,10,-122,52,-40+arm*0.6-(kick?20:0));
    d.body.setAttribute('transform',`rotate(${Math.sin(beat*Math.PI/2)*4})`);
  });
}

/* ---------- render frame ---------- */
function render(t){
  // ink bloom becomes the wash for mountains
  const bl=seg(t,0.2,2.6,eo); $('bloom').setAttribute('r',bl*260);
  $('bloom').setAttribute('opacity',(1-seg(t,1.8,3.6))*.9);
  $('mtnFar').setAttribute('opacity',seg(t,1.8,4.2)*(1-0.6*seg(t,20,22)));
  $('mtnNear').setAttribute('opacity',seg(t,2.4,5)*(1-0.5*seg(t,20,22)));
  // paper cutouts slide up
  [['hill3',2.0],['hill2',2.5],['hill1',3.0]].forEach(([id,s])=>$(id).setAttribute('transform',`translate(0,${(1-seg(t,s,s+1.4,eo))*320})`));
  const sp=seg(t,3.4,4.6,eo); const sun=$('sun'); sun.setAttribute('opacity',sp);
  sun.setAttribute('transform',`translate(1500 ${250-Math.sin(t*.3)*6}) scale(${0.3+0.7*sp+Math.sin(Math.PI*sp)*.15}) translate(-1500 -250)`);
  const cp=seg(t,4,5.4,eo); $('cloud').setAttribute('opacity',cp); $('cloud').setAttribute('transform',`translate(${-260*(1-cp)+t*6},0)`);

  // dance line + footprints
  const dl=seg(t,4.2,13,x=>x); draw(dline,dl);
  dline.setAttribute('opacity',1-seg(t,19.5,20.5));
  prints.forEach(p=>p.g.setAttribute('opacity',(p.d<dl*dline._L?.75:0)*(1-seg(t,19.5,20.5))));

  poseDancers(t);

  // title phase
  const tOut=1-seg(t,19.6,20.6);
  animDraw('k_title',t,10.6,0.5,1.7,1);
  $('wash').setAttribute('opacity',seg(t,13.5,16)*0.10*tOut);
  $('t_en').setAttribute('opacity',seg(t,15,16.2)); $('t_en').setAttribute('letter-spacing',34-14*seg(t,15,17));
  animK('k_tag',t,15.2,0.07,0.6,'rise',1);
  $('title1').setAttribute('opacity',tOut);

  // end card
  draw(sweep,seg(t,20.6,22.2)); sweep.setAttribute('visibility',t>20.5?'visible':'hidden');
  animK('k_en',t,22.3,0.07,0.55,'pop');
  animK('k_name',t,22.9,0.16,0.7,'pop');
  animK('k_sub',t,26.0,0.05,0.5,'rise');
  // gold shimmer + twinkling sparkles
  const gd=$('gold'); const gx=(t*340)%520; gd.setAttribute('x1',gx); gd.setAttribute('x2',gx+520);
  SP.forEach(s=>{const v=Math.max(0,Math.sin(Math.PI*2*((t-24.2)*1.3+s.ph*5)));const a=Math.pow(v,3)*cl((t-24)/0.6);
    s.u.setAttribute('transform',`translate(${s.x},${s.y}) rotate(${(t*40+s.ph*300)%360}) scale(${s.s*2.1*(0.3+0.9*a)})`);s.u.setAttribute('opacity',a)});
  const sl=seg(t,26,26.5,eo); const seal=$('seal'); seal.setAttribute('opacity',sl);
  seal.setAttribute('transform',`translate(1610 640) rotate(-6) scale(${1.9-0.9*sl})`);

  // captions
  let ci=-1; VT.forEach((v,i)=>{if(t>=v-0.1&&t<v+VDUR[i]+0.5)ci=i});
  const cap=$('cap'), cg=$('capg');
  if(ci>=0){ if(cap.textContent!==CAPS[ci]){cap.textContent=CAPS[ci];const w=cap.getComputedTextLength()+80;$('capbg').setAttribute('x',960-w/2);$('capbg').setAttribute('width',w);}
    cg.setAttribute('opacity',Math.min(seg(t,VT[ci]-0.1,VT[ci]+0.2),1-seg(t,VT[ci]+VDUR[ci]+0.2,VT[ci]+VDUR[ci]+0.5)));
  } else cg.setAttribute('opacity',0);
  // final fade
  $('svg').style.opacity = 1-seg(t,29.4,30)*0.0;
}

/* ---------- music (Web Audio, 128 BPM, bright K-pop / pop line-dance groove) ---------- */
function buildMusic(ctx,out,t0){
  const sb=60/BPM, mk=(f)=>440*Math.pow(2,(f-69)/12);
  const noise=ctx.createBuffer(1,ctx.sampleRate,ctx.sampleRate); const nd=noise.getChannelData(0); for(let i=0;i<nd.length;i++)nd[i]=Math.random()*2-1;
  const env=(g,t,a,v,d)=>{g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+d)};
  const kick=t=>{const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);env(g,t,.003,.85,.24);o.connect(g).connect(out);o.start(t);o.stop(t+.3)};
  const nz=(t,hp,v,d,type='highpass')=>{const s=ctx.createBufferSource();s.buffer=noise;const f=ctx.createBiquadFilter();f.type=type;f.frequency.value=hp;const g=ctx.createGain();env(g,t,.002,v,d);s.connect(f).connect(g).connect(out);s.start(t);s.stop(t+d+.05)};
  const clap=t=>{nz(t,1400,.42,.13,'bandpass');nz(t+.012,1800,.3,.11,'bandpass');nz(t+.024,2200,.25,.1,'bandpass')};
  const tone=(t,n,type,v,d,lp=3000,bend=0,a=.005)=>{const o=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(mk(n),t);if(bend)o.frequency.exponentialRampToValueAtTime(mk(n+bend),t+d);f.type='lowpass';f.frequency.setValueAtTime(lp,t);f.frequency.exponentialRampToValueAtTime(Math.max(200,lp*.3),t+d);env(g,t,a,v,d);o.connect(f).connect(g).connect(out);o.start(t);o.stop(t+d+.05)};
  const pad=(t,ns,d,v=.03)=>ns.forEach(n=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=mk(n);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(v,t+.25);g.gain.linearRampToValueAtTime(0.0001,t+d);o.connect(g).connect(out);o.start(t);o.stop(t+d+.1)});
  const bell=(t,n,v=.08)=>{tone(t,n,'sine',v,.9,6000,0,.002);tone(t,n+12,'sine',v*.4,.6,6000,0,.002)};
  // C  G  Am  F  (I V vi IV) - bright major feel
  const roots=[36,43,45,41], chords=[[60,64,67],[59,62,67],[57,60,64],[57,60,65]];
  const lead=[72,74,76,79,81,84,76,74];        // C-major pentatonic hook
  const hook=[[0,2,4,2,5,4,2,-1],[1,3,5,3,6,5,3,-1],[2,4,5,4,7,5,4,-1],[0,2,4,5,7,5,4,2]];
  const bars=16;
  for(let b=0;b<bars;b++){
    const bt=t0+b*4*sb, c=b%4, last=b===bars-1;
    pad(bt,chords[c],4*sb,b>=11?.04:.028);
    for(let q=0;q<4;q++){
      const t=bt+q*sb;
      if(b>=1&&!last){ kick(t); if(b>=2&&(q===1||q===3)) clap(t); }
      if(last&&q===0){ kick(t); clap(t); }
      if(b>=1&&!last){ nz(t+sb/2,7500,.2,.09); nz(t,9000,.06,.03); nz(t+sb/4,9000,.04,.025); nz(t+sb*3/4,9000,.04,.025); }
      if(b>=1&&!last){ tone(t,roots[c],'square',.17,sb*.42,420); tone(t+sb/2,roots[c]+12,'square',.13,sb*.3,520); }       // bouncy bass
      if(b>=2&&!last){ chords[c].forEach(n=>tone(t+sb/2,n+12,'sawtooth',.045,.12,3200)); }                                 // off-beat stabs
    }
    if(b>=3&&!last) for(let s=0;s<16;s++){ const n=chords[c][s%3]+12+(s%6>=3?12:0); tone(bt+s*sb/4,n,'triangle',.05,.1,5000); } // sparkle arp
    if(b>=4&&!last){ const h=hook[c]; for(let e=0;e<8;e++){ const m=h[e]; if(m<0)continue; tone(bt+e*sb/2,lead[m%8]+(b>=11?0:-0),'sawtooth',b>=11?.12:.085,sb*.45,4200,0,.004); if(b>=11) tone(bt+e*sb/2,lead[m%8]+12,'square',.03,sb*.3,5000); } }
    if(b===10){ for(let i=0;i<16;i++) nz(bt+2*sb+i*sb/8,1500+i*500,.05+i*.008,.1); }                                           // riser
    if(b===11){ nz(bt,3500,.5,.9); kick(bt); }                                                                                 // crash into end card
  }
  // name reveal chimes (shine)
  [84,88,91,96,100,103].forEach((n,i)=>bell(t0+24.0+i*0.14,n,.07));
  bell(t0+26.1,96,.08); bell(t0+27.4,103,.06);
  pad(t0+bars*4*sb-1.5,[60,64,67,72],2.5,.04);
}

/* ---------- playback ---------- */
let ctx,t0,raf;
function b64buf(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer}
async function start(){
  $('play').style.display='none';
  if(!KB) await buildKinetic();
  if(ctx) ctx.close();
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain(); master.connect(ctx.destination);
  const music=ctx.createGain(); music.connect(master); music.gain.value=.55;
  const bufs=await Promise.all(VOICE.map(b=>ctx.decodeAudioData(b64buf(b))));
  VDUR=bufs.map(b=>b.duration);
  t0=ctx.currentTime+0.15;
  buildMusic(ctx,music,t0);
  bufs.forEach((b,i)=>{const s=ctx.createBufferSource();s.buffer=b;const g=ctx.createGain();g.gain.value=1.25;s.connect(g).connect(master);s.start(t0+VT[i]);
    music.gain.setTargetAtTime(.28,t0+VT[i]-.15,.08); music.gain.setTargetAtTime(.55,t0+VT[i]+b.duration+.1,.25);});
  master.gain.setValueAtTime(1,t0+28.5); master.gain.linearRampToValueAtTime(0.0001,t0+30.5);
  cancelAnimationFrame(raf);
  const loop=()=>{const t=ctx.currentTime-t0; render(Math.max(0,t)); if(t<DUR+0.3) raf=requestAnimationFrame(loop); else {$('play').style.display='flex';$('play').lastChild.textContent='다시 재생';}};
  loop();
}
$('play').onclick=start;
const qt=new URLSearchParams(location.search).get('t');
if(qt!==null){ $('play').style.display='none'; buildKinetic().then(()=>render(+qt)); } else buildKinetic().then(()=>render(0));
</script>
